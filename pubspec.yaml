name: paper_shaders
description: "Paper Shaders 的 Flutter 运行时着色器移植，提供 30 种效果、类型化参数、预设、共享资源缓存与离屏渲染，支持图片采样和多次材质合成。"
version: 0.0.4
# 本仓库是 fork，通过 git 依赖接入，不发布到 pub.dev。
publish_to: none
homepage: https://github.com/tech-ming/paper-shaders-flutter
repository: https://github.com/tech-ming/paper-shaders-flutter
issue_tracker: https://github.com/tech-ming/paper-shaders-flutter/issues
documentation: https://github.com/tech-ming/paper-shaders-flutter#readme

topics:
  - shaders
  - flutter
  - graphics
  - animation
  - effects

screenshots:
  - description: "Paper Shaders 部分效果的历史预览拼图。"
    path: doc/showcase-grid.jpg

environment:
  sdk: ^3.6.2
  flutter: ">=3.27.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# 声明随包提供的着色器与采样贴图。
flutter:
  shaders:
    - shaders/dot_orbit.frag
    - shaders/gem_smoke.frag
    - shaders/grain_gradient.frag
    - shaders/halftone_cmyk.frag
    - shaders/halftone_dots.frag
    - shaders/heatmap.frag
    - shaders/image_dithering.frag
    - shaders/liquid_metal.frag
    - shaders/mesh_gradient.frag
    - shaders/paper_texture.frag
    - shaders/pulsing_border.frag
    - shaders/simplex_noise.frag
    - shaders/waves.frag
    - shaders/color_panels.frag
    - shaders/dithering.frag
    - shaders/dot_grid.frag
    - shaders/fluted_glass.frag
    - shaders/god_rays.frag
    - shaders/metaballs.frag
    - shaders/neuro_noise.frag
    - shaders/perlin_noise.frag
    - shaders/smoke_ring.frag
    - shaders/spiral.frag
    - shaders/static_mesh_gradient.frag
    - shaders/static_radial_gradient.frag
    - shaders/swirl.frag
    - shaders/voronoi.frag
    - shaders/warp.frag
    - shaders/water.frag
    - shaders/lens_distortion.frag
  assets:
    - assets/gem_smoke.png
    - assets/heatmap.png
    - assets/liquid_metal.png
    - assets/noise.png
