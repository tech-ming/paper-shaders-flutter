name: paper_shaders_example
description: "paper_shaders 的效果与预设交互示例。"
# 示例仅用于开发与演示。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  paper_shaders:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# 示例使用已提交的静态缩略图。
flutter:
  uses-material-design: true
  assets:
    - assets/thumbnails/
